<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multitrack Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="controls">
    <button id="load">Load</button>
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <button id="mute">Mute All</button>
    <button id="unmute">Unmute All</button>
  </div>

  <div id="loading">Loading: 0 / 24 files</div>
  <div id="playhead">Playhead: 0.00s</div>

  <div id="loop-controls">
    <label>A: <input type="range" id="sliderA" min="0" max="60" step="0.1" value="0"></label>
    <div style="position: relative; height: 120px;">
      <canvas id="amplitudeGraph" width="800" height="100"></canvas>
      <div id="playhead-line"></div>
    </div>
    <label>B: <input type="range" id="sliderB" min="0" max="60" step="0.1" value="60"></label>
  </div>

  <div id="tracks"></div>

  <script src="script.js"></script>
</body>
</html>
