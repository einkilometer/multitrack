<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multitrack Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   <canvas id="amplitudeGraph" width="100%" height="1"></canvas>
  <div id="controls">
    <button id="load">Load Soundfiles</button>
    <button id="play">Start</button>
    <button id="stop">Stop</button>
    <button id="mute">Mute All</button>
    <button id="unmute">Unmute</button>
  </div>
  <div id="loop-controls">
    <label>Start:<br> <input type="range" id="sliderA" min="0" max="60" step="0.1" value="0" style="width: 100%;"></label>
    <div id="playhead">Playhead: 0.00s</div> <input type="range" id="playheadSlider" min="0" max="60" step="0.01" value="0" style="width: 100%;"><br>
    <label>Stop:: <input type="range" id="sliderB" min="0" max="60" step="0.1" value="60" style="width: 100%;"></label>
  </div>
  <div id="tracks"></div>
  
  <div id="loading">[No files loaded]</div>
  
  <script src="script.js"></script>
</body>
</html>
