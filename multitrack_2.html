<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multitrack Monitor</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 10px;
    }
    #controls {
      margin-bottom: 10px;
    }
    button {
      margin-right: 6px;
      padding: 6px 10px;
      font-size: 14px;
    }
    #loading {
      margin: 10px 0;
      font-weight: bold;
    }
    #playhead {
      margin: 10px 0;
      font-size: 16px;
    }
    .track {
      display: flex;
      align-items: center;
      height: 24px;
      margin-bottom: 2px;
      background: #222;
      padding: 2px 6px;
      font-size: 12px;
    }
    .track-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meter {
      width: 100px;
      height: 8px;
      background: #444;
      margin-left: 10px;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      background: limegreen;
    }
    .peak-hold {
      position: absolute;
      top: 0;
      height: 100%;
      width: 2px;
      background: red;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <button id="mute">Mute All</button>
    <button id="unmute">Unmute All</button>
  </div>
  <div id="loading">Loading: 0 / 24 files</div>
  <div id="playhead">Playhead: 0.00s</div>
  <div id="tracks"></div>

  <script>
    const audioFiles = [
      { "sec":  "7", "name": "CH 1 Rohde NT1 Cardioid with smooth front capture", "url": "01-1 Rohde NT1.mp3" },
      { "sec":  "12", "name": "CH 2 Austrain Audio OC 818 in figure-eight with attenuation 90° and 270° ", "url": "02-2 Austrain Audio OC 818.mp3" },
      { "sec":  "19", "name": "CH 3 AKG C2000B Cardioid tight front with a lift within 5 kHz and 10 kHz", "url": "03-3 AKG C2000B.mp3" },
      { "sec":  "26", "name": "CH 4 Sennheiser ME67 Supercardioid Shotgun with narrow pickup angle", "url": "04-4 Sennheiser K6 ME67.mp3" },
      { "sec":  "35", "name": "CH 5 AKG C1000S in Hypercardioid configuraton adds 3–5 dB lift between 5–9 kHz", "url": "05-5 AKG C1000S.mp3" },
      { "sec":  "42", "name": "CH 6 t.bone MB 7 Beta Cardioid dynamic capsule with lift around 12 kHz", "url": "06-6 T-BONE MB 7 Beta.mp3" },
      { "sec":  "51", "name": "CH 7 [spoken text: Superlux Shotgun Niere] t.bone EM 9600 in Super Cardioid mode warm ~ left side", "url": "07-7 t.bone EM 9600 in Cardioid mode.mp3" },
      { "sec":  "65", "name": "CH 8 [spoken text: Superlux Shotgun Tele ] t.bone EM 9600 as Tele -2dB side attenuation ~ right side", "url": "08-8 t.bone EM 9600 in Tele mode.mp3" },
      { "sec":  "173", "name": "zoom H4 Cardioid Left of XY Stereo pair", "url": "09-zoom H4 Kanäle Richtwirkung.mp3" },
      { "sec":  "173", "name": "zoom H4 Cardioid Right of XY Stereo pair", "url": "10-zoom H4 Kanäle Richtwirkung.mp3" },
      { "sec":  "179", "name": "zoom H2n MS Mid", "url": "21-MS zoom H2n Kanäle Richtwirkung.mp3" },
      { "sec":  "179", "name": "zoom H2n MS Side", "url": "22-MS zoom H2n Kanäle Richtwirkung.mp3" },
      { "sec":  "179", "name": "zoom H2n Left XY ", "url": "23-XY zoom H2n Kanäle Richtwirkung.mp3" },
      { "sec":  "179", "name": "zoom H2n Right XY", "url": "24-XY zoom H2n Kanäle Richtwirkung.mp3" },
      { "sec":  "183", "name": "LS-100 Cardioid Left of XY Stereo pair", "url": "11-250925 LS-100 Kanäle Richtwirkung.mp3" },
      { "sec":  "183", "name": "LS-100 Cardioid Right of XY Stereo pair", "url": "12-250925 LS-100 Kanäle Richtwirkung.mp3" },
      { "sec":  "188", "name": "tascam DR-40X Left moderate ambient pickup", "url": "19-tascam DR-40X Kanäle Richtwirkung.mp3" },
      { "sec":  "188", "name": "tascam DR-40X Right moderate ambient pickup", "url": "20-tascam DR-40X Kanäle Richtwirkung.mp3" },
      { "sec":  "196", "name": "SE Ambeo FLU Omnidirektional Front Left Up", "url": "15-Ambeo FLU Sennheiser Kanäle Richtwirkung MixPre-002 3.mp3" },
      { "sec":  "196", "name": "SE Ambeo FRD Omnidirektional Front Rear Down", "url": "16-Ambeo FRD Sennheiser Kanäle Richtwirkung MixPre-002 4.mp3" },
      { "sec":  "196", "name": "SE Ambeo BLD Omnidirektional Back Left Down", "url": "17-Ambeo BLD Sennheiser Kanäle Richtwirkung MixPre-002 5.mp3" },
      { "sec":  "196", "name": "SE Ambeo BRU Omnidirektional Back Reight Up", "url": "18-Ambeo BRU Sennheiser Kanäle Richtwirkung MixPre-002 6.mp3" },
      { "sec":  "200", "name": "SE MKH 418s Mid of Stereo MS Shotgun with presence lift", "url": "13-Sennheiser Stereo MS Shotgun Kanäle Richtwirkung Sounddevices 702 CF T09.mp3" },
      { "sec":  "200", "name": "SE MKH 418s Side open and spacious", "url": "14-Sennheiser Stereo MS Shotgun Kanäle Richtwirkung Sounddevices 702 CF T09.mp3" }    ]
    ];
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let buffers = [], sources = [], gains = [], analysers = [], peakHolds = [], soloStates = [], startTime = null;
    let isMuted = false;

    async function loadFiles() {
      const loadingDisplay = document.getElementById("loading");
      let loadedCount = 0;

      for (let track of audioFiles) {
        try {
          const response = await fetch(track.url);
          const arrayBuffer = await response.arrayBuffer();
          const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
          buffers.push(audioBuffer);
          loadedCount++;
          loadingDisplay.textContent = `Loading: ${loadedCount} / ${audioFiles.length} files`;
        } catch (err) {
          loadingDisplay.textContent = `Error loading: ${track.name}`;
          console.error(`Failed to load ${track.name}`, err);
        }
      }

      loadingDisplay.textContent = `✅ All ${loadedCount} files loaded`;
    }

    function createUI() {
      const container = document.getElementById("tracks");
      container.innerHTML = "";
      audioFiles.forEach((track, i) => {
        const div = document.createElement("div");
        div.className = "track";
        div.innerHTML = `
          <div class="track-name">${track.name}</div>
          <div class="meter" id="meter-${i}">
            <div class="meter-fill" id="fill-${i}"></div>
            <div class="peak-hold" id="peak-${i}"></div>
          </div>
        `;
        container.appendChild(div);
        peakHolds[i] = 0;
      });
    }

    function updateMeters() {
      analysers.forEach((analyser, i) => {
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const peak = Math.max(...data);
        const percent = peak / 255;
        const dB = 20 * Math.log10(percent || 0.0001);
        const fill = document.getElementById(`fill-${i}`);
        const peakBar = document.getElementById(`peak-${i}`);

        fill.style.width = `${percent * 100}%`;

        if (dB > peakHolds[i]) {
          peakHolds[i] = dB;
        } else {
          peakHolds[i] -= 0.5; // decay
        }

        const peakPercent = Math.pow(10, peakHolds[i] / 20);
        peakBar.style.left = `${Math.min(peakPercent * 100, 100)}%`;
      });

      updatePlayhead();
      requestAnimationFrame(updateMeters);
    }

    function updatePlayhead() {
      if (!startTime) return;
      const elapsed = ctx.currentTime - startTime;
      document.getElementById("playhead").textContent = `Playhead: ${elapsed.toFixed(2)}s`;
    }

    async function playAll() {
      await loadFiles();
      createUI();
      startTime = ctx.currentTime + 0.5;

      buffers.forEach((buf, i) => {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const gain = ctx.createGain();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;

        src.connect(gain).connect(analyser).connect(ctx.destination);
        src.start(startTime);

        sources[i] = src;
        gains[i] = gain;
        analysers[i] = analyser;
      });

      updateMeters();
    }

    function stopAll() {
      sources.forEach(src => {
        try { src.stop(); } catch {}
      });
      sources = [];
      startTime = null;
    }

    function muteAll() {
      gains.forEach(g => g.gain.value = 0);
      isMuted = true;
    }

    function unmuteAll() {
      gains.forEach(g => g.gain.value = 1);
      isMuted = false;
    }

    document.getElementById("play").addEventListener("click", playAll);
    document.getElementById("stop").addEventListener("click", stopAll);
    document.getElementById("mute").addEventListener("click", muteAll);
    document.getElementById("unmute").addEventListener("click", unmuteAll);
  </script>
</body>
</html>
